
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.vp"

    defaultConfig {
        applicationId "com.vp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.6"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            def propsFile = new File(
                System.getProperty('user.home'),
                '.gradle/gradle.properties'
            )

            if (!propsFile.exists()) {
                throw new GradleException(
                    "Missing user Gradle properties file: ${propsFile}"
                )
            }

            def signingProps = new Properties()
            propsFile.withInputStream {
                signingProps.load(it)
            }

            def keystoreName = signingProps.getProperty(
                'VENDOR_UPLOAD_STORE_FILE'
            )

            if (!keystoreName) {
                throw new GradleException(
                    "VENDOR_UPLOAD_STORE_FILE is missing"
                )
            }

            def keystoreFile = file(keystoreName)

            if (!keystoreFile.exists()) {
                throw new GradleException(
                    "Release keystore not found: ${keystoreFile}"
                )
            }

            def storePass = signingProps.getProperty(
                'VENDOR_UPLOAD_STORE_PASSWORD'
            )
            def keyName = signingProps.getProperty(
                'VENDOR_UPLOAD_KEY_ALIAS'
            )
            def keyPass = signingProps.getProperty(
                'VENDOR_UPLOAD_KEY_PASSWORD'
            )

            if (!storePass || !keyName || !keyPass) {
                throw new GradleException(
                    "Release signing properties are incomplete"
                )
            }

            storeFile keystoreFile
            storePassword storePass
            keyAlias keyName
            keyPassword keyPass
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile(
                "proguard-android-optimize.txt"
            ), "proguard-rules.pro"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Vendor version ${variant.versionName}.apk"
        }

        if (variant.buildType.name == 'debug') {
            variant.assembleProvider.configure {
                doLast {
                    def apkDir = file(
                        "${layout.buildDirectory.get()}/outputs/apk/debug"
                    )

                    def customApk = new File(
                        apkDir,
                        "Vendor version ${variant.versionName}.apk"
                    )

                    if (customApk.exists()) {
                        copy {
                            from customApk
                            into apkDir
                            rename {
                                "app-debug.apk"
                            }
                        }
                    }
                }
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
