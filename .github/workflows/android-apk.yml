
name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore

          test -s android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_STORE_PASSWORD" ] || \
             [ -z "$RELEASE_KEY_ALIAS" ] || \
             [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: One or more release signing secrets are missing."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify release APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release"

          if ! compgen -G "$APK_PATH/*.apk" > /dev/null; then
            echo "ERROR: No release APK was generated."
            exit 1
          fi

          ls -lh "$APK_PATH"/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: react-native-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean up release keystore
        if: always()
        run: rm -f android/app/release.keystore
