
name: Vendor Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install npm dependencies
        run: npm ci

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VENDOR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing VENDOR_KEYSTORE_BASE64 secret"
            exit 1
          }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/vendor-release.keystore

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.VENDOR_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VENDOR_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VENDOR_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || {
            echo "Missing store password secret"
            exit 1
          }
          test -n "$KEY_ALIAS" || {
            echo "Missing key alias secret"
            exit 1
          }
          test -n "$KEY_PASSWORD" || {
            echo "Missing key password secret"
            exit 1
          }

          mkdir -p "$HOME/.gradle"
          export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD

          python3 <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              value = value.replace("\\", "\\\\")
              for char in ("=", ":", "#", "!"):
                  value = value.replace(char, "\\" + char)
              if value.startswith(" "):
                  value = "\\" + value
              return value

          props = {
              "VENDOR_UPLOAD_STORE_FILE": "vendor-release.keystore",
              "VENDOR_UPLOAD_KEY_ALIAS": os.environ["KEY_ALIAS"],
              "VENDOR_UPLOAD_STORE_PASSWORD": os.environ["STORE_PASSWORD"],
              "VENDOR_UPLOAD_KEY_PASSWORD": os.environ["KEY_PASSWORD"],
          }

          path = Path.home() / ".gradle" / "gradle.properties"
          with path.open("w", encoding="iso-8859-1") as file:
              for key, value in props.items():
                  file.write(f"{key}={escape(value)}\n")
          PY

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: vendor-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
